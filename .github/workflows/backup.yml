name: Database Backup

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch: {} # lets you trigger a one-off backup manually from the Actions tab

jobs:
  backup:
    name: Backup Supabase Postgres
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      # --format=custom produces a compressed, pg_restore-only dump — not
      # plain SQL, but much smaller and lets you restore just specific
      # tables if needed instead of the whole database.
      - name: Dump database
        run: pg_dump --no-owner --format=custom --file=backup.dump "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 30
