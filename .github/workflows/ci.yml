name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jyo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build
        run: pnpm run build

      - name: Run migrations against the CI test database
        run: pnpm run test:db:migrate

      - name: Run tests
        # Bypasses the docker-compose-based pretest/posttest lifecycle in
        # package.json's "test" script — the postgres service above already
        # provides the test DB, no need to spin up docker-in-docker here.
        run: pnpm exec vitest run

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check and build
        run: pnpm run build

  deploy-backend:
    name: Deploy backend (Render)
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No local `vercel build` step — its build-sandbox emulation hit a
      # CLI bug (v57 + Node 24: "spawn sh ENOENT" despite PATH/sh being
      # fine in this job). `vercel deploy --prod` uploads the source and
      # builds on Vercel's actual infrastructure instead, same as the old
      # git-integration auto-deploy did — we only need the deploy gated
      # behind CI passing, not the build to literally run inside CI.
      #
      # Runs from the repo root, not `frontend/` — the Vercel project's
      # own "Root Directory" setting is already "frontend" (left over
      # from when it was git-connected), so running this from inside
      # frontend/ too would make Vercel look for frontend/frontend.
      - name: Deploy to Vercel
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
