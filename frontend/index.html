<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Jyo</title>
    <meta name="description" content="Have extra food? Give it to someone near you in Tirupati. Free. No payment. No delivery." />
    <meta name="keywords" content="food sharing tirupati, free food tirupati, jyo, community food, leftover food" />
    <meta name="author" content="Jyo" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.jyo.co.in/" />

    <!-- Open Graph: controls how link looks when shared on WhatsApp, Twitter, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.jyo.co.in/" />
    <meta property="og:title" content="Jyo" />
    <meta property="og:description" content="Have extra food? Give it to someone near you in Tirupati. Free. No payment. No delivery." />
    <meta property="og:image" content="https://www.jyo.co.in/og-image.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jyo" />
    <meta name="twitter:description" content="Have extra food? Give it to someone near you in Tirupati." />
    <meta name="twitter:image" content="https://www.jyo.co.in/og-image.png" />

    <!-- Add to Home Screen -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0C0E0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jyo" />
    <link rel="apple-touch-icon" href="/icons-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Pages on the redesigned v2 palette (see src/lib/theme.ts). Set before
         first paint so they don't flash the old background while the bundle
         loads. Grows as pages move over; removed once all have. -->
    <script>
      if (["/", "/login", "/register", "/forgot-password", "/reset-password", "/verify-email", "/profile", "/feed", "/my-posts"].includes(location.pathname) || location.pathname.startsWith("/posts/"))
        document.documentElement.dataset.theme = "v2";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
